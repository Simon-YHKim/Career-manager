name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege — neither job needs more than read access to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node (typecheck · build · test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout@v4.3.1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Activate pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.33.2 --activate
          pnpm --version
          node --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages (must precede typecheck — web imports built .d.ts)
        run: pnpm --filter "./packages/*" build

      - name: Typecheck (all workspaces)
        run: pnpm -r typecheck

      - name: Test packages
        run: pnpm --filter "./packages/*" test

      - name: Build web
        run: pnpm --filter web build

  android:
    name: Android (lint · assembleDebug)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout@v4.3.1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      # actions/setup-java@v4.8.0
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: 17

      # android-actions/setup-android@v3.2.2
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Lint
        working-directory: apps/android
        run: ./gradlew :app:lint --stacktrace

      - name: Assemble debug APK
        working-directory: apps/android
        run: ./gradlew :app:assembleDebug --stacktrace
